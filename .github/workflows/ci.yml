name: CI
on: { push: { branches: [main] }, pull_request: {}, schedule: [{ cron: "27 6 * * 1" }], workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: "8.3" }
      - run: for f in $(git ls-files '*.php'); do php -l "$f"; done
      - run: php tests/test_pure.php
